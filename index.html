<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>俄罗斯方块</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    touch-action: manipulation;
    overflow: hidden;
  }
  .game-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }
  .game-container {
    background: #16213e;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transform-origin: center center;
  }
  .top-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    justify-content: center;
  }
  .play-area {
    text-align: center;
    flex-shrink: 0;
    line-height: 0;
  }
  canvas#board {
    background: #0f3460;
    border: 2px solid #e94560;
    border-radius: 4px;
    display: block;
  }
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 110px;
  }
  .panel-box {
    background: #0f3460;
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .panel-box h3 {
    color: #e94560;
    font-size: 12px;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .panel-box .value {
    font-size: 22px;
    font-weight: bold;
  }
  canvas#next {
    background: #0f3460;
    border-radius: 4px;
    display: block;
    margin: 0 auto;
  }
  #status {
    font-size: 13px;
    font-weight: bold;
    color: #e94560;
    min-height: 18px;
  }
  button#startBtn {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
    font-weight: bold;
    transition: background 0.2s;
  }
  button#startBtn:active { background: #a82d44; }
  .controls-hint {
    font-size: 11px;
    color: #aaa;
    text-align: center;
  }
  .controls-hint kbd {
    background: #0f3460;
    padding: 2px 6px;
    border-radius: 4px;
    color: #fff;
    border: 1px solid #e94560;
  }
  .touch-controls {
    display: none;
    width: 100%;
    padding-top: 2px;
  }
  .touch-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .touch-btn {
    background: #0f3460;
    border: 2px solid #e94560;
    border-radius: 10px;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: background 0.1s;
    height: 44px;
    flex: 1;
    min-width: 0;
  }
  .touch-btn:active, .touch-btn.active { background: #e94560; }
  .touch-btn.wide { flex: 2; font-size: 14px; }
  @media (pointer: coarse) {
    .touch-controls { display: block; }
    .controls-hint { display: none; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
<div class="game-container" id="gameContainer">
  <div class="top-row">
    <div class="play-area">
      <canvas id="board" width="300" height="600"></canvas>
    </div>
    <div class="side-panel">
      <div class="panel-box">
        <h3>下一个</h3>
        <canvas id="next" width="100" height="100"></canvas>
      </div>
      <div class="panel-box">
        <h3>得分</h3>
        <div class="value" id="score">0</div>
      </div>
      <div class="panel-box">
        <h3>行数</h3>
        <div class="value" id="lines">0</div>
      </div>
      <div class="panel-box">
        <div id="status">按「开始」</div>
      </div>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="controls-hint">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> 移动 &nbsp; <kbd>&uarr;</kbd> 旋转 &nbsp; <kbd>&darr;</kbd> 下落 &nbsp; <kbd>Space</kbd> 直落
  </div>
  <div class="touch-controls">
    <div class="touch-row">
      <button class="touch-btn" data-action="left">&#9664;</button>
      <button class="touch-btn" data-action="rotate">&#8635;</button>
      <button class="touch-btn" data-action="right">&#9654;</button>
    </div>
    <div class="touch-row">
      <button class="touch-btn" data-action="down">&#9660;</button>
      <button class="touch-btn wide" data-action="drop">直落</button>
    </div>
  </div>
</div>
</div>
<script>
const COLS = 10;
const ROWS = 20;
const LOGICAL_BLOCK = 30;
const LOGICAL_WIDTH = COLS * LOGICAL_BLOCK;
const LOGICAL_HEIGHT = ROWS * LOGICAL_BLOCK;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = LOGICAL_WIDTH;
canvas.height = LOGICAL_HEIGHT;

const nextCanvas = document.getElementById('next');
const nextCtx = nextCanvas.getContext('2d');
nextCanvas.width = 100;
nextCanvas.height = 100;

const scoreEl = document.getElementById('score');
const linesEl = document.getElementById('lines');
const statusEl = document.getElementById('status');
const container = document.getElementById('gameContainer');

const SHAPES = [
  { matrix: [[1,1,1,1]], color: '#00f0f0' },
  { matrix: [[1,1],[1,1]], color: '#f0f000' },
  { matrix: [[0,1,0],[1,1,1]], color: '#a000f0' },
  { matrix: [[0,1,1],[1,1,0]], color: '#00f000' },
  { matrix: [[1,1,0],[0,1,1]], color: '#f00000' },
  { matrix: [[1,0,0],[1,1,1]], color: '#0000f0' },
  { matrix: [[0,0,1],[1,1,1]], color: '#f0a000' }
];

let board = [];
let currentPiece = null;
let nextPiece = null;
let score = 0;
let lines = 0;
let gameOver = false;
let running = false;
let dropInterval = null;

function createBoard() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
}

function randomPiece() {
  const idx = Math.floor(Math.random() * SHAPES.length);
  const shape = SHAPES[idx];
  return {
    matrix: shape.matrix.map(row => [...row]),
    color: shape.color,
    x: Math.floor((COLS - shape.matrix[0].length) / 2),
    y: 0
  };
}

function rotateMatrix(matrix) {
  const rows = matrix.length;
  const cols = matrix[0].length;
  return Array.from({ length: cols }, (_, c) =>
    Array.from({ length: rows }, (_, r) => matrix[rows - 1 - r][c])
  );
}

function isValid(piece, offsetX, offsetY) {
  for (let r = 0; r < piece.matrix.length; r++) {
    for (let c = 0; c < piece.matrix[0].length; c++) {
      if (piece.matrix[r][c]) {
        const nx = piece.x + c + (offsetX || 0);
        const ny = piece.y + r + (offsetY || 0);
        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
        if (ny < 0) continue;
        if (board[ny][nx]) return false;
      }
    }
  }
  return true;
}

function lockPiece() {
  const p = currentPiece;
  for (let r = 0; r < p.matrix.length; r++) {
    for (let c = 0; c < p.matrix[0].length; c++) {
      if (p.matrix[r][c]) {
        const y = p.y + r, x = p.x + c;
        if (y < 0) { endGame(); return; }
        board[y][x] = p.color;
      }
    }
  }
  clearLines();
  spawnPiece();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; ) {
    if (board[r].every(cell => cell !== 0)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      cleared++;
    } else { r--; }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];
    score += points[Math.min(cleared, 4)] || 0;
    lines += cleared;
    scoreEl.textContent = score;
    linesEl.textContent = lines;
  }
}

function spawnPiece() {
  currentPiece = nextPiece || randomPiece();
  nextPiece = randomPiece();
  currentPiece.x = Math.floor((COLS - currentPiece.matrix[0].length) / 2);
  currentPiece.y = 0;
  drawNext();
  if (!isValid(currentPiece, 0, 0)) { endGame(); }
}

function endGame() {
  gameOver = true;
  running = false;
  if (dropInterval) { clearInterval(dropInterval); dropInterval = null; }
  statusEl.textContent = '游戏结束';
}

function moveLeft() {
  if (!running || gameOver) return;
  if (isValid(currentPiece, -1, 0)) { currentPiece.x--; draw(); }
}
function moveRight() {
  if (!running || gameOver) return;
  if (isValid(currentPiece, 1, 0)) { currentPiece.x++; draw(); }
}
function rotatePiece() {
  if (!running || gameOver) return;
  const rotated = rotateMatrix(currentPiece.matrix);
  const old = currentPiece.matrix;
  currentPiece.matrix = rotated;
  if (!isValid(currentPiece, 0, 0)) { currentPiece.matrix = old; }
  draw();
}
function hardDrop() {
  if (!running || gameOver) return;
  while (isValid(currentPiece, 0, 1)) { currentPiece.y++; }
  lockPiece();
  draw();
}
function softDrop() {
  if (!running || gameOver) return;
  if (isValid(currentPiece, 0, 1)) { currentPiece.y++; draw(); }
  else { lockPiece(); draw(); }
}

function drawBlock(ctx, x, y, color, size) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x * size + 1, y * size + 1, size - 2, 3);
  ctx.fillRect(x * size + 1, y * size + 1, 3, size - 2);
}

function draw() {
  ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(ctx, c, r, board[r][c], LOGICAL_BLOCK);
    }
  }
  if (currentPiece) {
    for (let r = 0; r < currentPiece.matrix.length; r++) {
      for (let c = 0; c < currentPiece.matrix[0].length; c++) {
        if (currentPiece.matrix[r][c]) {
          const x = currentPiece.x + c, y = currentPiece.y + r;
          if (y >= 0) drawBlock(ctx, x, y, currentPiece.color, LOGICAL_BLOCK);
        }
      }
    }
  }
}

function drawNext() {
  nextCtx.clearRect(0, 0, 100, 100);
  const matrix = nextPiece.matrix;
  const rows = matrix.length, cols = matrix[0].length;
  const size = 22;
  const ox = (100 - cols * size) / 2, oy = (100 - rows * size) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (matrix[r][c]) {
        nextCtx.fillStyle = nextPiece.color;
        nextCtx.fillRect(ox + c * size + 1, oy + r * size + 1, size - 2, size - 2);
        nextCtx.fillStyle = 'rgba(255,255,255,0.15)';
        nextCtx.fillRect(ox + c * size + 1, oy + r * size + 1, size - 2, 3);
        nextCtx.fillRect(ox + c * size + 1, oy + r * size + 1, 3, size - 2);
      }
    }
  }
}

function gameLoop() {
  if (!running || gameOver) return;
  softDrop();
}

function startGame() {
  if (dropInterval) clearInterval(dropInterval);
  createBoard();
  score = 0; lines = 0;
  gameOver = false; running = true;
  scoreEl.textContent = '0';
  linesEl.textContent = '0';
  statusEl.textContent = '游戏中';
  nextPiece = randomPiece();
  spawnPiece();
  draw();
  dropInterval = setInterval(() => gameLoop(), 500);
}

function fitToScreen() {
  const wrapper = container.parentElement;
  const availW = wrapper.clientWidth;
  const availH = wrapper.clientHeight;
  const naturalW = container.scrollWidth;
  const naturalH = container.scrollHeight;
  const scale = Math.min(availW / naturalW, availH / naturalH, 1);
  container.style.transform = `scale(${scale})`;
}

window.addEventListener('resize', fitToScreen);
window.addEventListener('orientationchange', () => setTimeout(fitToScreen, 200));

document.addEventListener('keydown', (e) => {
  if (!running && e.key === 'Enter') { startGame(); return; }
  switch (e.key) {
    case 'ArrowLeft':  e.preventDefault(); moveLeft(); break;
    case 'ArrowRight': e.preventDefault(); moveRight(); break;
    case 'ArrowUp':    e.preventDefault(); rotatePiece(); break;
    case 'ArrowDown':  e.preventDefault(); softDrop(); break;
    case ' ':          e.preventDefault(); hardDrop(); break;
  }
});

document.getElementById('startBtn').addEventListener('click', startGame);

const touchRepeatTimers = {};
const REPEAT_DELAY = 170;

function startAction(action) {
  if (!running || gameOver) return;
  switch (action) {
    case 'left': moveLeft(); break;
    case 'right': moveRight(); break;
    case 'down': softDrop(); break;
    case 'rotate': rotatePiece(); break;
    case 'drop': hardDrop(); return;
  }
  if (action === 'left' || action === 'right' || action === 'down') {
    stopRepeat(action);
    touchRepeatTimers[action] = setInterval(() => {
      switch (action) {
        case 'left': moveLeft(); break;
        case 'right': moveRight(); break;
        case 'down': softDrop(); break;
      }
    }, REPEAT_DELAY);
  }
}
function stopRepeat(action) {
  if (touchRepeatTimers[action]) {
    clearInterval(touchRepeatTimers[action]);
    delete touchRepeatTimers[action];
  }
}

document.querySelectorAll('.touch-btn').forEach(btn => {
  const action = btn.dataset.action;
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    btn.classList.add('active');
    startAction(action);
  });
  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    btn.classList.remove('active');
    stopRepeat(action);
  });
  btn.addEventListener('touchcancel', () => {
    btn.classList.remove('active');
    stopRepeat(action);
  });
  btn.addEventListener('mousedown', (e) => {
    e.preventDefault();
    btn.classList.add('active');
    startAction(action);
  });
  btn.addEventListener('mouseup', () => {
    btn.classList.remove('active');
    stopRepeat(action);
  });
  btn.addEventListener('mouseleave', () => {
    btn.classList.remove('active');
    stopRepeat(action);
  });
});

createBoard();
draw();
nextPiece = randomPiece();
drawNext();
fitToScreen();
</script>
</body>
</html>
